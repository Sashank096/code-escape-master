<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" fill="none">
  <defs>
    <linearGradient id="jersey" x1="120" y1="210" x2="302" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D5BE"/>
      <stop offset=".48" stop-color="#148D88"/>
      <stop offset="1" stop-color="#145354"/>
    </linearGradient>
    <linearGradient id="gold" x1="175" y1="178" x2="270" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE58B"/>
      <stop offset="1" stop-color="#FF9B42"/>
    </linearGradient>
    <linearGradient id="skin" x1="155" y1="82" x2="260" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD19A"/>
      <stop offset="1" stop-color="#C97751"/>
    </linearGradient>
    <linearGradient id="bat" x1="275" y1="32" x2="346" y2="317" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0B7"/>
      <stop offset=".62" stop-color="#D79B56"/>
      <stop offset="1" stop-color="#8E593C"/>
    </linearGradient>
    <filter id="shadow" x="30" y="12" width="370" height="540" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="0" y="0" width="420" height="560" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .captain { transform-box: fill-box; transform-origin: center bottom; animation: captain-bounce 2.8s ease-in-out infinite; }
    .swing-bat { transform-box: fill-box; transform-origin: 12% 83%; animation: bat-ready 2.8s ease-in-out infinite; }
    .flying-scarf { transform-box: fill-box; transform-origin: left center; animation: scarf-flick 1.8s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark-pop 1.5s ease-in-out infinite; }
    .spark:nth-of-type(2n) { animation-delay: .45s; }
    .spark:nth-of-type(3n) { animation-delay: .9s; }
    @keyframes captain-bounce { 0%,100% { transform: translateY(0) rotate(0); } 45% { transform: translateY(-5px) rotate(-.6deg); } 58% { transform: translateY(-3px) rotate(.6deg); } }
    @keyframes bat-ready { 0%,100% { transform: rotate(0); } 48% { transform: rotate(-3deg); } 63% { transform: rotate(2deg); } }
    @keyframes scarf-flick { 0%,100% { transform: rotate(0) scaleX(1); } 50% { transform: rotate(-5deg) scaleX(1.05); } }
    @keyframes spark-pop { 0%,100% { opacity: .4; transform: scale(.75) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(22deg); } }
    @media (prefers-reduced-motion: reduce) { .captain,.swing-bat,.flying-scarf,.spark { animation: none; } }
  </style>
